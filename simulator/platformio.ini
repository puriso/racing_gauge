[platformio]
src_dir = .
include_dir = ../include

[env:desktop]
platform = native@1.2.1
lib_deps = m5stack/M5GFX@0.3.0
extra_scripts = pre:build.py
build_src_filter = -<*> +<main.cpp> +<rendering.cpp>
build_flags =
  -std=gnu++17
  -Iinclude
  -I../src
  -DM5GFX_BOARD=board_M5StackCoreS3
  -DM5GFX_SCALE=2
