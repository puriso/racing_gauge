; PlatformIO Project Configuration File
;
;   ビルドオプション:  build flags, source filter
;   アップロード設定:  custom upload port, speed and extra flags
;   ライブラリ設定:    dependencies, extra library storages
;   高度な設定:       extra scripting
;
; その他のオプションと例はドキュメントを参照
; https://docs.platformio.org/page/projectconf.html

[platformio]
; デフォルトビルド対象の環境
default_envs = m5stack-cores3
; CI用のテスト環境をデフォルトに
test_default_envs = m5stack-cores3-ci

[hardware]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
lib_deps =
  m5stack/M5GFX@0.3.0
  m5stack/M5Unified@0.2.29
  m5stack/M5CoreS3@1.0.1
  adafruit/Adafruit ADS1X15@2.6.2
  adafruit/Adafruit BusIO@1.17.4
lib_ldf_mode = deep
monitor_speed = 115200

[env:m5stack-cores3]
extends = hardware
upload_port = COM11

[env:m5stack-cores3-ci]
extends = hardware
test_filter = ci_dummy

[env:native]
platform = native@1.2.1
test_filter = test_racing_mode
test_build_src = false
build_flags =
  -std=gnu++17
  -Itest/low_warning/stubs
