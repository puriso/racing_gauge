name: PlatformIO Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v3

      - name: Python を設定
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: pipキャッシュ
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: PlatformIOキャッシュ
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: PlatformIO インストール
        run: pip install platformio

      - name: intelhex インストール
        run: pip install intelhex

      - name: ビルド
        run: pio run -e m5stack-cores3

      - name: 低油圧警告の回帰テスト
        run: python3 test/low_warning/run_tests.py

      - name: 描画から独立したLOW監視の回帰テスト
        run: python3 test/low_warning/run_tests.py --monitoring

      - name: Rモード境界と解除の回帰テスト
        run: pio test -e native

      - name: 負温度の最高値・未取得・異常保持の回帰テスト
        run: python3 test/recorded_maximum/run_tests.py

      - name: 危険点選択・前後1分・画面遷移の回帰テスト
        run: python3 test/risk_history/run_tests.py

      - name: ファームウェアをアーティファクトで保存
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/m5stack-cores3/firmware.bin

      - name: ADC通信異常の回帰テスト
        run: python3 test/adc_reader/run_tests.py
