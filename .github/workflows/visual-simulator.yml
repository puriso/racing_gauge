name: SDL Visual Recording

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'simulator/**'
      - '.github/workflows/visual-simulator.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'simulator/**'
      - '.github/workflows/visual-simulator.yml'
  workflow_dispatch:
    inputs:
      scenario:
        description: '録画シナリオ'
        type: choice
        options: [all, ramp, warnings, startup, warm-start, menu]
        default: all

permissions:
  contents: read

jobs:
  record:
    outputs:
      artifact_url: ${{ steps.recording.outputs.artifact-url }}
      preview_artifact_id: ${{ steps.preview.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - name: SDL2 とビルドツール
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config build-essential
      - name: Python 依存
        run: python -m pip install -r simulator/requirements.txt
      - name: 本番描画を SDL 向けにビルド
        run: pio run -d simulator -e desktop
      - name: シナリオの録画と描画検証
        env:
          SIM_SCENARIO: ${{ inputs.scenario || 'all' }}
        run: python simulator/record.py --skip-build --scenario "$SIM_SCENARIO" --output simulator/out/ci
      - name: 今回の録画から紹介 GIF を生成
        if: (inputs.scenario || 'all') == 'all'
        run: python simulator/make_demo.py --recordings simulator/out/ci --output simulator/out/preview/gauge-demo.gif
      - name: コメント用 GIF を保存
        if: (inputs.scenario || 'all') == 'all'
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: visual-preview
          path: simulator/out/preview/gauge-demo.gif
          if-no-files-found: error
          retention-days: 14
      - name: MP4・PNG・HTML を保存
        id: recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-simulator
          path: simulator/out/ci/
          if-no-files-found: error
          retention-days: 14
      - name: 録画の開き方
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### SDL 目視テスト録画
          この実行の **Artifacts → visual-simulator** をダウンロード・展開し、`index.html` を開いてください。
          シナリオごとの `recording.mp4`、代表フレーム、全 PNG、入力 JSON を保存しています。
          油温-10〜170℃・水温-10〜130℃・油圧0〜10bar、短い油圧低下、始動時70℃、詳細画面の復帰を確認できます。
          本番の描画・平滑化・警告処理を使用し、センサーと時刻を模擬しています。
          SUMMARY

  comment:
    needs: record
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: sdl-visual-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: 今回の実行で生成した GIF だけを取得
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.record.outputs.preview_artifact_id }}
          path: ${{ runner.temp }}/visual-preview
          merge-multiple: true
      - name: GIF と録画レポートを PR に作成・更新
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ needs.record.outputs.artifact_url }}
          PREVIEW_FILE: ${{ runner.temp }}/visual-preview/gauge-demo.gif
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const expectedSha = context.payload.pull_request.head.sha;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            // 古いコミットの録画で最新コメントを上書きしない。
            if (pull.state !== 'open' || pull.head.sha !== expectedSha) {
              core.info('更新済み、またはクローズされた PR のためコメントを省略します。');
              return;
            }
            const artifactUrl = process.env.ARTIFACT_URL;
            if (!artifactUrl) throw new Error('録画成果物の URL がありません。');
            const fs = require('node:fs');
            const info = fs.lstatSync(process.env.PREVIEW_FILE);
            if (!info.isFile() || info.size > 1024 * 1024) {
              throw new Error('プレビューは1MiB以下の通常ファイルが必要です。');
            }
            const gif = fs.readFileSync(process.env.PREVIEW_FILE);
            if (!['GIF87a', 'GIF89a'].includes(gif.subarray(0, 6).toString('ascii'))) {
              throw new Error('プレビューがGIF形式ではありません。');
            }
            // GIF は専用ブランチに保存し、main や PR のコードを書き換えない。
            const branch = 'visual-previews';
            const path = `previews/pr-${issue_number}.gif`;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: pull.base.sha });
              } catch (creationError) {
                // 別 PR の初回公開と競合した場合も、作成済みの参照を確認して続行する。
                if (creationError.status !== 422) throw creationError;
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              }
            }
            let previewCommit;
            for (let attempt = 0; attempt < 3; attempt++) {
              let existing;
              try {
                ({ data: existing } = await github.rest.repos.getContent({ owner, repo, path, ref: branch }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existing?.type === 'file' && Buffer.from(existing.content, 'base64').equals(gif)) {
                // 同じ GIF の再実行では保存用コミットを増やさない。
                const { data: reference } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                previewCommit = reference.object.sha;
                break;
              }
              try {
                const { data: uploaded } = await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch, content: gif.toString('base64'),
                  message: `PR #${issue_number}: SDL preview ${expectedSha.slice(0, 7)}`,
                  ...(existing ? { sha: existing.sha } : {}),
                });
                previewCommit = uploaded.commit.sha;
                break;
              } catch (error) {
                // 別 PR が専用ブランチを更新した場合は最新状態で再試行する。
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (current.state !== 'open' || current.head.sha !== expectedSha) return;
            // コミット固定 URL にして、画像キャッシュと後続の更新から録画を分離する。
            const previewUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${previewCommit}/${path}`;
            const marker = '<!-- racing-gauge-sdl-recording -->';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### SDL 目視テスト録画',
              '',
              `[![昇温とLOW警告・回復の録画GIF](${previewUrl})](${artifactUrl})`,
              '',
              '今回のCI録画の抜粋です。昇温は12.5倍速、油圧低下・LOW警告・回復は等速で再生します。',
              '',
              `[録画レポートをダウンロード（MP4・index.html）](${artifactUrl})`,
              '',
              'ZIP を展開し、`index.html` をブラウザーで開いてください。各 `recording.mp4` も直接再生できます。',
              '油温-10〜170℃・水温-10〜130℃・油圧0〜10bar、LOW境界への瞬間的な低下と回復、始動時70℃を録画しています。',
              '',
              `対象: ${expectedSha.slice(0, 7)} · [CI の実行](${runUrl}) · 成果物の保存期間: 14日`,
              '同じ PR の録画が成功するたび、このコメントを更新します。',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
